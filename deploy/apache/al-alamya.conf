# ==============================================================================
# Al-Alamiya ERP/POS — Apache Production VirtualHost Configuration (Windows)
# معرض العالمية للمفروشات — إعداد خادم الويب للإنتاج على الشبكة المحلية
# ==============================================================================
# Architecture: Single Origin on Port 80
# Root (/) -> frontend/dist (React SPA)
# API (/api) -> backend/public (Laravel PHP)
# ==============================================================================

<VirtualHost *:80>
    ServerName elalamya.local
    ServerAlias 127.0.0.1 localhost

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Document Root points to React frontend built bundle
    DocumentRoot "d:/elalamya-main/frontend/dist"

    <Directory "d:/elalamya-main/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "d:/elalamya-main/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # 1. Pass Authorization Header to PHP
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    # 2. Block direct access to .env with 403 Forbidden
    RewriteRule (^\.env|/\.env) - [F,L]

    # 3. Route all /api/* requests to Laravel backend front controller
    RewriteRule ^/api/(.*)$ "d:/elalamya-main/backend/public/index.php" [L]

    # 4. Frontend React SPA: Fallback to /index.html for client-side routing
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{REQUEST_URI} !^/api
    RewriteRule ^ /index.html [L]

    # 4. Strict Security: Block sensitive directories and files
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/\.(git|github)">
        Require all denied
    </DirectoryMatch>

    <Directory "d:/elalamya-main/backend/storage">
        Require all denied
    </Directory>

    <Directory "d:/elalamya-main/backend/vendor">
        Require all denied
    </Directory>

    <Directory "d:/elalamya-main/backend/app">
        Require all denied
    </Directory>

    <Directory "d:/elalamya-main/backend/bootstrap">
        Require all denied
    </Directory>

    <Directory "d:/elalamya-main/backend/config">
        Require all denied
    </Directory>

    <Directory "d:/elalamya-main/backend/database">
        Require all denied
    </Directory>

    ErrorLog "logs/elalamya_error.log"
    CustomLog "logs/elalamya_access.log" combined
</VirtualHost>
